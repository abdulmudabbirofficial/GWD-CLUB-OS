name: gwd_club_os
description: GWD Club OS — club management for GWD Global. Android, iOS and Web from one codebase.
publish_to: "none"
version: 6.1.0+9

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking + live sync
  http: ^1.2.2
  socket_io_client: ^2.0.3+1

  # Local persistence: session token and the offline-first cache
  shared_preferences: ^2.3.2

  # Native home-screen widgets (Section 7). Bridges shared data to Android
  # Glance/RemoteViews and iOS WidgetKit — Flutter cannot draw launcher
  # widgets itself.
  home_widget: ^0.6.0

  url_launcher: ^6.3.2

  # Official event paperwork has to come off the phone somehow: permission
  # letters arrive as a PDF in WhatsApp or a photo of a signed page.
  file_picker: ^12.3.0

  # Documents are served from an authenticated route, so they cannot simply be
  # handed to the browser as a URL — the token travels as a header. These two
  # let the app fetch the bytes itself, cache them, and hand the file to
  # whatever the phone already uses to read a PDF.
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  fl_chart: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  # Two faces, each doing a job the other cannot.
  #
  # Bundled, never fetched at runtime: this app is used on college Wi-Fi and on
  # a laptop hotspot, and a typeface that arrives over the network is a typeface
  # that is missing exactly when the room is full. It also keeps the web build
  # clear of the CSP, which blocks third-party font hosts by design.
  #
  # Both are variable fonts, so one file covers every weight - smaller than the
  # four static cuts it replaces, and the `wght` axis is set per style in
  # GwdType rather than being approximated.
  fonts:
    # One variable file per family, declared once per weight.
    #
    # The repetition is deliberate and is how Flutter drives a variable axis:
    # a variable font declared without `weight` is treated as a single 400
    # face, and asking for w700 gets *synthetic* bold — a smeared fake — rather
    # than the real cut. Declaring the weights maps each one onto the `wght`
    # axis, which also means plain `fontWeight` keeps working at the 50-odd
    # call sites that override it, instead of silently doing nothing.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 300
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
        - asset: assets/fonts/Inter.ttf
          weight: 800
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 700

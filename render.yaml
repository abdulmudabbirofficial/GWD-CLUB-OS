# Render blueprint for GWD Club OS.
#
# One web service serves both the API and the Flutter web build. That is
# deliberate: the app resolves its API base to the origin it was served from on
# web (see ApiConfig.resolve), so a single origin means no CORS configuration,
# no second URL to keep in sync, and cookies/tokens that cannot drift apart.
#
# To deploy: in Render, New > Blueprint, point it at this repository. Render
# reads this file and creates the service. The variables marked `sync: false`
# are NOT in this file and never in git — you set them in the dashboard once.
#
# Read DEPLOY.md before the first deploy. Two things about the free plan will
# bite you otherwise: uploaded files do not survive a redeploy, and the service
# sleeps after 15 minutes of no traffic.

services:
  - type: web
    name: gwd-club-os
    runtime: node
    plan: free
    region: singapore        # closest Render region to India; lower latency
    branch: main

    buildCommand: ./render-build.sh
    startCommand: node backend/src/index.js

    # Render restarts the service if this stops answering. /api/health reports
    # honestly — it says `changeStreams: false` when Mongo is not a replica set
    # rather than pretending live sync works.
    healthCheckPath: /api/health

    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # Render injects PORT itself and the app already reads it. Listed here
      # only so nobody "helpfully" hardcodes 4000 in the dashboard.
      - key: PORT
        sync: false

      # --- the database --------------------------------------------------
      # MongoDB Atlas. Render has no managed MongoDB, and a *replica set* is
      # not optional here: Change Streams are built on the oplog, and without
      # one live sync silently does nothing. Atlas free (M0) is a three-node
      # replica set, so it works.
      #
      # Format:
      #   mongodb+srv://USER:PASSWORD@cluster.xxxxx.mongodb.net/?retryWrites=true&w=majority
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: gwd_club_os

      # --- identity ------------------------------------------------------
      # Generated by Render and never seen by anyone. Changing it signs every
      # member out, because every existing token stops verifying.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d

      # --- the roots of trust --------------------------------------------
      # "Name:email:password" entries, comma separated. These are real
      # passwords: set them in the dashboard, never in this file.
      #   SEED_DIRECTORS=Asha Rao:director1@gwd.club:<pw>,Vikram S:director2@gwd.club:<pw>
      - key: SEED_DIRECTORS
        sync: false
      - key: SEED_FACULTY
        sync: false
      - key: SEED_PRESIDENT
        sync: false

      # --- the rest ------------------------------------------------------
      - key: CLUB_NAME
        value: GWD Club

      # Same origin serves the app, so the API does not need to allow anyone
      # else. Widen this only if you later host the web build somewhere else.
      - key: CLIENT_ORIGIN
        sync: false

      # Local hour the daily "still open" reminder sweep runs from.
      # Render runs in UTC — 09:00 IST is 03:30 UTC, so 3 here.
      - key: REMINDER_HOUR
        value: "3"

      # UPLOAD_DIR is deliberately NOT set here.
      #
      # Unset, it defaults to backend/uploads inside the container, which is
      # always writable — but is WIPED ON EVERY DEPLOY, so permission letters
      # and expense receipts do not survive. Documents added as *links* are
      # unaffected, because those are just URLs in the database.
      #
      # To keep uploaded files: switch to `plan: starter`, uncomment the disk
      # below, and add UPLOAD_DIR=/var/data/uploads in the dashboard. Setting
      # that path without the disk is the one way to get it wrong — the API
      # now refuses uploads with a clear message instead of failing to boot,
      # but the files still would not persist.

    # --- persistent storage ------------------------------------------------
    # Uncomment together with `plan: starter` above. Render disks are not
    # available on the free plan, and without one every uploaded file is lost
    # on each deploy.
    #
    # disk:
    #   name: gwd-uploads
    #   mountPath: /var/data
    #   sizeGB: 1
